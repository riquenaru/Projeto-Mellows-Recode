spring.application.name=mellows-api
google.books.api-key=${GOOGLE_BOOKS_API_KEY:}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mellows}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mellows}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mellows_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
